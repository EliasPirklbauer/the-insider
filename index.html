    if(g.ap>g.hp){A.w++;H.l++}else if(g.ap<g.hp){H.w++;A.l++}else{A.t++;H.t++}});
}

function leaders(c){
  const sp={pass:["pass",2],rush:["rush",1],rec:["rec",1],sack:["def",1],int:["def",2]}[c],m={};
  S.games.filter(g=>g.s===S.season&&g.pl).forEach(g=>["a","h"].forEach(side=>((g.pl[side]||{})[sp[0]]||[]).forEach(r=>{

function autoTS(g){
  if(!g.pl)return;const ts=g.ts=g.ts||{},cat=(s,c)=>(g.pl[s]||{})[c]||[],sum=(rows,i)=>rows.reduce((x,r)=>x+(+(r.v||[])[i]||0),0);

    if(ps.length)(ts.pass=ts.pass||{})[s]=sum(ps,2);
    if(ru.length)(ts.rush=ts.rush||{})[s]=sum(ru,1);

const POSF={QB:1.45,HB:.8,FB:.4,WR:1.1,TE:.9,LT:1,RT:1,LG:.85,RG:.85,C:.85,LE:1.1,RE:1.1,DT:1,LOLB:.9,MLB:.9,ROLB:.9,CB:1.1,FS:.85,SS:.85,K:.2,P:.2};
function tv(p){

const sortedAsc=()=>[...TEAMS].sort((x,y)=>pct(x.a)-pct(y.a)||diff(x.a)-diff(y.a)).map(t=>t.a);
function pickAssets(a){

      out.push({key:`k:${y}-${r}-${orig}`,y,r,orig,pn,idx,v,label:`${y} Runde ${r}${orig!==a?" (via "+orig+")":""}${pn?" · Pick "+pn:""}`})};
    if(d&&d.picks.length)d.picks.forEach((p,i)=>{if(p.own===a&&!p.pid)add(p.r,p.orig,p.p,i)});
    else for(let r=1;r<=7;r++)TEAMS.forEach(t=>{if((S.fp[`${y}-${r}-${t.a}`]||t.a)===a)add(r,t.a,null,null)});
  }

}
function assetOf(team,key){
  if(key[0]==="p"){const p=ros(team).find(x=>x.id===key.slice(2));return p?{key,p,v:tv(p),cap:ch(p,0),label:`${p.n||"–"} (${p.pos}, ${+p.ovr>0?p.ovr:"?"} OVR)`}:null}

}
function tradeCalc(){
  const A=S.trA,B=S.trB,sa=S.trSel.a.map(k=>assetOf(A,k)).filter(Boolean),sb=S.trSel.b.map(k=>assetOf(B,k)).filter(Boolean);
  const va=sa.reduce((x,y)=>x+y.v,0),vb=sb.reduce((x,y)=>x+y.v,0);
  const outA=sa.reduce((x,y)=>x+y.cap,0),outB=sb.reduce((x,y)=>x+y.cap,0);
  const capA=space(A)+outA-outB,capB=space(B)+outB-outA;

  if(capB<0&&capB<space(B))err.push(`${T(B).n} würden ${M(-capB)} über dem Cap landen.`);

  if([...sa,...sb].some(x=>x.p&&!(+x.p.ovr>0)))warn.push("Spieler ohne OVR werden nach ihrem Draft-Pick bewertet oder mit 0.");

}
function execTrade(c){

      Object.keys(S.depth[from]||{}).forEach(pos=>{S.depth[from][pos]=S.depth[from][pos].filter(id=>id!==pl.id)})}
    else{const d=x.y===S.season?S.drafts[x.y]:null;
      if(d&&d.picks.length){const pk=d.picks.find(p=>p.r===x.r&&p.orig===x.orig);if(pk)pk.own=to}

  d.picks=[];for(let r=1;r<=7;r++)ts.forEach((a,i)=>d.picks.push({r,p:(r-1)*32+i+1,orig:a,own:S.fp[`${S.season}-${r}-${a}`]||a,pid:null}));
}
function doPick(i,pid){
  const d=DR(),pk=d.picks[i],pr=d.pros.find(x=>x.id===pid);
  if(!pk||pk.pid||!pr||d.picks.some(x=>x.pid===pid))return;
  pk.pid=pid;const c={};for(let k=1;k<=4;k++)c[S.season+k]=rookie(pk.p);
  ros(pk.own).push({id:pr.id,n:pr.n,pos:pr.pos,ovr:0,age:pr.age,col:pr.col,dy:S.season,dr:pk.r,dp:pk.p,ch:c,bonus:0,dead:0});
}

function drCap(d){

  const m={};TEAMS.forEach(t=>m[t.a]={a:t.a,n:0,v:0,r1:0});

const NT=[["all","Alle"],["league","Liga"],["trade","Trades"],["game","Spiele"],["draft","Draft"],["cap","Cap"],["own","Eigene"]];
function perf(g){
  const best=(cat,i)=>{let b=null;["a","h"].forEach(s=>(((g.pl||{})[s]||{})[cat]||[]).forEach(r=>{const v=+r.v[i]||0;if(r.n&&v>0&&(!b||v>b.v))b={n:r.n,v,td:+r.v[cat==="pass"?3:2]||0}}));return b};
  const p=best("pass",2),r=best("rush",1),c=best("rec",1),o=[];
  if(p)o.push(`${p.n} wirft für ${p.v} Yards${p.td?" und "+p.td+" Touchdown"+(p.td>1?"s":""):""}`);
  if(r)o.push(`${r.n} läuft für ${r.v} Yards`);
  if(c)o.push(`${c.n} fängt ${c.v} Yards`);
  return o.length?"Bester Mann des Spiels: "+o.join(", ")+".":"";
}
function gameStory(g){
  const a=g.a,h=g.h,hi=Math.max(g.ap,g.hp),lo=Math.min(g.ap,g.hp),m=hi-lo,tag="Spiel · "+WL(g.w);
  if(!m)return{k:"game",tm:[a,h],gid:g.id,tag,h:`${T(a).n} und ${T(h).n} trennen sich ${hi}:${lo} unentschieden`,b:`Kein Sieger in ${WL(g.w)}. ${perf(g)}`.trim()};
  const w=g.ap>g.hp?a:h,l=w===a?h:a,v=m<=3?"bezwingen knapp":m>=17?"deklassieren":"schlagen";
  const to=g.ts&&g.ts.to?{w:+g.ts.to[w===a?"a":"h"]||0,l:+g.ts.to[w===a?"h":"a"]||0}:null;
  const tt=to&&to.l-to.w>=2?` Die Turnover (${to.w}:${to.l}) gaben den Ausschlag.`:"";
  return{k:"game",tm:[w,l],gid:g.id,tag,h:`${T(w).n} ${v} ${T(l).n} ${hi}:${lo}`,b:`${T(w).n} gewinnen in ${WL(g.w)} mit ${m} Punkten Vorsprung und stehen aktuell bei ${rec(w)}, ${T(l).n} bei ${rec(l)}.${tt} ${perf(g)}`.trim()};
}
function newsItems(){

  S.news.forEach((h,i)=>out.push({k:"own",tag:"Eigene Meldung",h,b:"",i}));
  if(pl.length){
    headlines().forEach(x=>out.push({k:"league",tag:"Liga",h:x.h,b:x.d}));
    ["AFC","NFC"].forEach(c=>{const sd=seeds(c),inn=new Set(sd.map(x=>x.a)),nx=TEAMS.filter(t=>t.c===c&&!inn.has(t.a)).map(t=>t.a).sort(cmp)[0],l=sd[6];
      if(l&&nx&&G(l.a)>0&&G(nx)>0)out.push({k:"league",tm:[l.a,nx],tag:"Playoff-Rennen · "+c,h:`${T(l.a).n} halten den letzten Playoff-Platz`,b:`In der ${c} stehen ${T(l.a).n} (${rec(l.a)}) auf Seed 7. Dahinter lauern ${T(nx).n} (${rec(nx)}).`})});
  }

  S.games.filter(g=>g.s===S.season&&g.ap!=null).sort((x,y)=>y.w-x.w).forEach(g=>out.push(gameStory(g)));

    const f=d.picks[0];
    out.push({k:"draft",tm:[f.own],tag:"Draft "+S.season,h:`${T(f.own).n} haben den ersten Pick`,b:`Die Draft-Order ${S.season} steht. Pick 1 ist laut Tradewert-Tabelle ${pv(1)} Punkte wert, der letzte Pick der siebten Runde nur ${pv(224)}.`});
    d.picks.filter(p=>p.pid).sort((x,y)=>y.p-x.p).forEach(p=>{const q=d.pros.find(x=>x.id===p.pid);if(!q)return;
      out.push({k:"draft",tm:[p.own],tag:`Draft · Runde ${p.r}, Pick ${p.p}`,h:`${T(p.own).n} wählen ${q.n}`,b:`${q.pos}${q.col?" von "+q.col:""} geht an Position ${p.p} (Runde ${p.r}). Der Pick ist ${pv(p.p)} Tradewert-Punkte wert, der Rookie-Vertrag kostet etwa ${M(rookie(p.p))} pro Jahr.${p.own!==p.orig?" Der Pick kam per Tausch von "+T(p.orig).n+".":""}`})});
  }

  if(ts.length){
    ts.map(t=>t.a).filter(a=>space(a)<0).sort((x,y)=>space(x)-space(y)).forEach(a=>out.push({k:"cap",tm:[a],tag:"Cap",h:`${T(a).n} liegen ${M(-space(a))} über dem Cap`,b:`Cap Hits von ${M(used(a))} plus ${M(+S.dead[a]||0)} Dead Cap bei einem Cap von ${M(S.cap)}. Vor neuen Verpflichtungen muss das Team Gehalt abbauen.`}));
    const top=ts.map(t=>t.a).filter(a=>space(a)>0).sort((x,y)=>space(y)-space(x)).slice(0,3);
    if(top.length)out.push({k:"cap",tm:top,tag:"Cap",h:`Die meiste Cap-Luft: ${top.map(a=>T(a).n).join(", ")}`,b:top.map(a=>`${T(a).n} ${M(space(a))}`).join(" · ")+". Wer Spielraum hat, kann in der Free Agency zuschlagen oder Verträge aufnehmen, die andere loswerden müssen."});
    const ex=ts.map(t=>{const l=ros(t.a).filter(p=>ch(p,0)>0&&ch(p,1)===0);return{a:t.a,n:l.length,c:l.reduce((x,p)=>x+ch(p,0),0)}}).sort((x,y)=>y.c-x.c)[0];
    if(ex&&ex.n)out.push({k:"cap",tm:[ex.a],tag:"Cap",h:`${T(ex.a).n}: Viele Verträge laufen aus`,b:`${ex.n} Verträge (${M(ex.c)} Cap Hit) enden nach ${S.season}. Das schafft Spielraum, aber Stammspieler müssen ersetzt oder verlängert werden.`});
    let bp=null,bt=null;ts.forEach(t=>ros(t.a).forEach(p=>{if(!bp||ch(p,0)>ch(bp,0)){bp=p;bt=t.a}}));
    if(bp&&ch(bp,0)>0)out.push({k:"cap",tm:[bt],tag:"Cap",h:`${bp.n||"Ein Spieler"} ist der teuerste Spieler der Liga`,b:`${T(bt).n} zahlen ${bp.pos} ${bp.n||""} ${M(ch(bp,0))} Cap Hit in ${S.season}, das sind ${(ch(bp,0)/S.cap*100).toFixed(1)} % des Salary Caps.`});
  }
  return out;
}

function readLogo(f,cb,max){
  if(!f||!/^image\//.test(f.type)){cb(null);return}
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onerror=()=>cb(null);im.onload=()=>{
    const w=im.naturalWidth||max,h=im.naturalHeight||max,k=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    let u;try{u=c.toDataURL("image/png")}catch(e){u=rd.result}cb(u)};im.src=rd.result};
  rd.onerror=()=>cb(null);rd.readAsDataURL(f);
}

const COLRE=/^(#[0-9a-f]{3,8}|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*(0|1|0?\.\d+)\s*)?\))$/i;
const KSIZE={"1":"x-small","2":"small","3":"medium","4":"large","5":"x-large","6":"xx-large","7":"xxx-large"};
function cleanStyle(st){
  const out=[];
  String(st||"").split(";").forEach(d=>{
    const i=d.indexOf(":");if(i<0)return;const p=d.slice(0,i).trim().toLowerCase(),v=d.slice(i+1).trim();
    if((p==="color"||p==="background-color")&&COLRE.test(v))out.push(p+":"+v);
    else if(p==="font-size"&&(/^(xx-small|x-small|small|medium|large|x-large|xx-large|xxx-large)$/.test(v)||(/^\d{1,2}(\.\d+)?px$/.test(v)&&parseFloat(v)>=9&&parseFloat(v)<=72)))out.push(p+":"+v);
    else if(p==="text-align"&&/^(left|right|center|justify)$/.test(v))out.push(p+":"+v);
    else if(p==="font-weight"&&/^(bold|normal|[1-9]00)$/.test(v))out.push(p+":"+v);
    else if(p==="font-style"&&/^(italic|normal)$/.test(v))out.push(p+":"+v);
    else if((p==="text-decoration"||p==="text-decoration-line")&&/^(underline|line-through)( solid)?$/.test(v))out.push("text-decoration:"+v.split(" ")[0]);
    else if(p==="font-family"){const f=fontMap(v);if(f)out.push("font-family:"+f)}
  });
  return out.join(";");
}
function sanitizeHTML(h){
  if(typeof DOMParser==="undefined")return esc(String(h||"").replace(/<[^>]*>/g,""));
  const doc=new DOMParser().parseFromString("<body>"+String(h||"")+"</body>","text/html");
  const walk=n=>{[...n.childNodes].forEach(c0=>{
    let c=c0;
    if(c.nodeType===3)return;
    if(c.nodeType!==1){c.remove();return}
    let t=c.tagName;
    if(t==="SCRIPT"||t==="STYLE"||t==="IFRAME"||t==="OBJECT"||t==="EMBED"){c.remove();return}
    if(t==="FONT"){
      const sp=doc.createElement("span"),css=[],col=c.getAttribute("color"),fa=c.getAttribute("face"),sz=c.getAttribute("size");
      if(col&&COLRE.test(col))css.push("color:"+col);if(fa&&fontMap(fa))css.push("font-family:"+fontMap(fa));if(sz&&KSIZE[sz])css.push("font-size:"+KSIZE[sz]);
      if(css.length)sp.setAttribute("style",css.join(";"));
      while(c.firstChild)sp.appendChild(c.firstChild);c.replaceWith(sp);c=sp;t="SPAN";
    }
    walk(c);
    if(!AOK[t]){while(c.firstChild)n.insertBefore(c.firstChild,c);c.remove();return}
    const keep=t==="A"?["href"]:t==="IMG"?["src","alt"]:["style","class"];
    [...c.attributes].forEach(a=>{if(!keep.includes(a.name))c.removeAttribute(a.name)});
    if(c.hasAttribute("style")){if(["IMG","A","HR","FIGURE","FIGCAPTION"].includes(t))c.removeAttribute("style");else{const s=cleanStyle(c.getAttribute("style"));if(s)c.setAttribute("style",s);else c.removeAttribute("style")}}
    if(c.hasAttribute("class")){const ok=ACLS[t]||[],cl=c.getAttribute("class").split(/\s+/).filter(x=>ok.includes(x));if(cl.length)c.setAttribute("class",cl.join(" "));else c.removeAttribute("class")}
    if(t==="A"){const u=c.getAttribute("href")||"";if(!/^(https?:\/\/|mailto:)/i.test(u)){while(c.firstChild)n.insertBefore(c.firstChild,c);c.remove();return}c.setAttribute("target","_blank");c.setAttribute("rel","noopener noreferrer")}
    if(t==="IMG"){const u=c.getAttribute("src")||"";if(!/^(data:image\/(png|jpe?g|gif|webp);base64,|https:\/\/)/i.test(u))c.remove()}
    if(t==="FIGURE"&&!c.querySelector("img")){while(c.firstChild)n.insertBefore(c.firstChild,c);c.remove();return}
    if(t==="FIGCAPTION"&&!(c.textContent||"").trim())c.remove();
  })};
  walk(doc.body);return doc.body.innerHTML;
}
